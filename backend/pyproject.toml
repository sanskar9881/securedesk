[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# DTZ = flake8-datetimez. This is the enforcement behind the timestamp
# invariant: "all timestamps are UTC, timezone-aware; never datetime.now()
# naive". Evidence entries hash their timestamps (Phase 3) — a naive
# datetime that regresses in silently would corrupt every hash computed
# from it, so this is CI-blocking, not a suggestion.
#
# DTZ001  datetime.datetime() called without tzinfo
# DTZ002  datetime.datetime.today() is naive by construction
# DTZ003  datetime.datetime.utcnow() — deprecated in 3.12, banned here
# DTZ004  datetime.datetime.utcfromtimestamp() — same problem as utcnow()
# DTZ005  datetime.datetime.now() without tz=
# DTZ006  datetime.datetime.fromtimestamp() without tz=
# DTZ007  datetime.datetime.strptime() without an explicit .replace(tzinfo=...)
# DTZ011  datetime.date.today() — usually meant to be tz-aware datetime
# DTZ012  datetime.date.fromtimestamp() without tz
select = ["DTZ"]

[tool.ruff.lint.per-file-ignores]
# ml/classifier.py trains against historical CSV timestamps that are
# genuinely date-only and never hashed into evidence; exempt rather than
# force a fake tzinfo onto training data.
"ml/*" = ["DTZ"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
