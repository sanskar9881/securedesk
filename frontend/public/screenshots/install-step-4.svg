  <circle cx="56" cy="28" r="8" fill="#fbbf24"/>
  <circle cx="80" cy="28" r="8" fill="#34d399"/>
  <rect x="140" y="14" width="600" height="28" rx="14" fill="#ffffff"/>
  <text x="165" y="34" font-size="18" fill="#374151" font-family="Arial, sans-serif">chrome://extensions</text>
  <rect x="60" y="110" width="1080" height="560" rx="18" fill="#ffffff" stroke="#d1d5db"/>
  <text x="92" y="160" font-size="32" fill="#111827" font-family="Arial, sans-serif" font-weight="700">Extensions</text>
  <rect x="92" y="190" width="1030" height="108" rx="16" fill="#f9fafb" stroke="#e5e7eb"/>
