<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Load unpacked dialog</title>
  <desc id="desc">A file picker dialog open to a downloaded SecureDesk extension folder with manifest.json visible.</desc>
  <rect width="1200" height="760" fill="#eef2ff"/>
  <rect x="150" y="110" width="900" height="540" rx="20" fill="#ffffff" stroke="#c7d2fe"/>
  <rect x="180" y="150" width="860" height="54" rx="12" fill="#f3f4f6"/>
  <text x="210" y="184" font-size="18" fill="#374151" font-family="Arial, sans-serif">Choose a folder to load</text>
  <rect x="180" y="228" width="860" height="342" rx="12" fill="#f9fafb" stroke="#e5e7eb"/>
  <rect x="210" y="270" width="760" height="80" rx="12" fill="#e0f2fe" stroke="#bae6fd"/>
  <text x="250" y="320" font-size="24" fill="#0f172a" font-family="Arial, sans-serif">securedesk-extension</text>
  <rect x="210" y="372" width="460" height="18" rx="9" fill="#d1d5db"/>
  <rect x="210" y="406" width="400" height="18" rx="9" fill="#d1d5db"/>
  <rect x="210" y="440" width="340" height="18" rx="9" fill="#d1d5db"/>
  <rect x="870" y="620" width="130" height="42" rx="10" fill="#111827"/>
  <text x="935" y="648" font-size="18" fill="#fff" font-family="Arial, sans-serif" text-anchor="middle">Select Folder</text>
  <text x="210" y="560" font-size="18" fill="#374151" font-family="Arial, sans-serif">manifest.json is visible inside the extension folder</text>
</svg>
