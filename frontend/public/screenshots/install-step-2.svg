<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Chrome developer mode enabled</title>
  <desc id="desc">A Chrome Extensions page with Developer mode turned on and the Load unpacked button visible underneath the extension list.</desc>
  <rect width="1200" height="760" fill="#f3f4f6"/>
  <rect x="0" y="0" width="1200" height="56" fill="#e5e7eb"/>
  <circle cx="32" cy="28" r="8" fill="#f87171"/>
  <circle cx="56" cy="28" r="8" fill="#fbbf24"/>
  <circle cx="80" cy="28" r="8" fill="#34d399"/>
  <rect x="140" y="14" width="600" height="28" rx="14" fill="#ffffff"/>
  <text x="165" y="34" font-size="18" fill="#374151" font-family="Arial, sans-serif">chrome://extensions</text>
  <rect x="60" y="98" width="1080" height="620" rx="18" fill="#ffffff" stroke="#d1d5db"/>
  <text x="92" y="152" font-size="32" fill="#111827" font-family="Arial, sans-serif" font-weight="700">Extensions</text>
  <rect x="90" y="168" width="1020" height="54" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <rect x="930" y="182" width="130" height="28" rx="14" fill="#2563eb"/>
  <text x="995" y="201" font-size="16" fill="#fff" font-family="Arial, sans-serif" text-anchor="middle">On</text>
  <text x="130" y="200" font-size="22" fill="#111827" font-family="Arial, sans-serif">Developer mode</text>
  <rect x="90" y="250" width="1020" height="120" rx="14" fill="#f5f5f5" stroke="#d1d5db"/>
  <rect x="120" y="278" width="86" height="86" rx="14" fill="#dbeafe"/>
  <text x="220" y="322" font-size="24" fill="#111827" font-family="Arial, sans-serif" font-weight="700">SecureDesk</text>
  <text x="220" y="350" font-size="18" fill="#4b5563" font-family="Arial, sans-serif">Enabled</text>
  <rect x="760" y="280" width="250" height="52" rx="12" fill="#111827"/>
  <text x="885" y="313" font-size="20" fill="#fff" font-family="Arial, sans-serif" text-anchor="middle">Load unpacked</text>
  <rect x="90" y="400" width="1020" height="190" rx="14" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="120" y="445" font-size="22" fill="#111827" font-family="Arial, sans-serif" font-weight="700">Developer tools are now available</text>
  <text x="120" y="490" font-size="18" fill="#374151" font-family="Arial, sans-serif">Use this button to install the browser extension from a local folder.</text>
  <rect x="120" y="520" width="210" height="42" rx="10" fill="#e5e7eb"/>
  <text x="225" y="548" font-size="18" fill="#111827" font-family="Arial, sans-serif" text-anchor="middle">Load unpacked</text>
</svg>
